services:
  postgres:
    image: postgres:16
    container_name: postgres-container
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - my-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  springboot-app:
    image: kostasfotos/pattern-detect-analyzer:latest
    container_name: pattern-detect-analyzer
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pattern_detect_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      PYTHON_SERVER_URL: http://python-server:5000
      UPLOAD_PARALLELISM: ${UPLOAD_PARALLELISM:-auto}
      UPLOAD_RESOURCE_PROFILE: ${UPLOAD_RESOURCE_PROFILE:-auto}
      PYTHON_SERVER_MAX_CONCURRENT_REQUESTS: ${UPLOAD_PARALLELISM:-auto}
      HOST_RAM_GB: ${HOST_RAM_GB:-}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost:3000,http://localhost:5173}
    depends_on:
      - postgres
      - python-server
    networks:
      - my-network
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1536M

  python-server:
    image: kostasfotos/pattern-detect-python-server:latest
    container_name: python-server-container
    ports:
      - "5000:5000"
    environment:
      UPLOAD_PARALLELISM: ${UPLOAD_PARALLELISM:-auto}
      UPLOAD_RESOURCE_PROFILE: ${UPLOAD_RESOURCE_PROFILE:-auto}
      HOST_RAM_GB: ${HOST_RAM_GB:-}
      EXTRACTOR_MAX_WORKERS: 1
      EXTRACTOR_MAX_QUEUED_JOBS: 2
    networks:
      - my-network
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 1536M

  react-ui:
    image: kostasfotos/pattern-detect-ui:latest
    container_name: pattern-detect-ui
    ports:
      - "3000:80"
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
